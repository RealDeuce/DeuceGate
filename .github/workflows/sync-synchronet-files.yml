name: Sync files from Synchronet upstream

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-synchronet-support-files
  cancel-in-progress: false

jobs:
  sync:
    name: Update tracked support files
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out DeuceGate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch support files from Synchronet
        run: ./.github/scripts/sync-synchronet-files.sh

      - name: Commit and push updates
        run: |
          if git diff --quiet -- \
              utf8_codepages.c utf8_codepages.h base64.c base64.h; then
            echo "No upstream changes."
            exit 0
          fi
          upstream_commit="$(git rev-parse refs/remotes/upstream-sbbs/master)"
          git add utf8_codepages.c utf8_codepages.h base64.c base64.h
          git commit -m "Sync support files from SynchronetBBS/sbbs@${upstream_commit:0:12}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
