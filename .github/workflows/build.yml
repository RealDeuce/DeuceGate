name: Build

on:
  push:
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Clang, OpenSSL)
            runner: ubuntu-24.04
            platform: linux
          - name: macOS (AppleClang, OpenSSL)
            runner: macos-15
            platform: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang g++ libssl-dev ninja-build pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3

      - name: Configure
        run: |
          extra_args=()
          if test "${{ runner.os }}" = "Linux"; then
            extra_args+=("-DCMAKE_C_COMPILER=clang" "-DCMAKE_CXX_COMPILER=clang++")
          fi
          if test "${{ runner.os }}" = "macOS"; then
            extra_args+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)")
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEUCESSH_CRYPTO_BACKEND=OpenSSL \
            "${extra_args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >-
          ctest --test-dir build --parallel 1 --timeout 120
          --output-on-failure --no-tests=error

      - name: Package
        id: package
        run: |
          arch="$(uname -m)"
          package_name="deucegate-${{ matrix.platform }}-${arch}"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}"
          cp build/deucegate README.md LICENSE THIRD_PARTY.md "${package_dir}/"
          cp -R LICENSES examples "${package_dir}/"
          tar -C dist -czf "dist/${package_name}.tar.gz" "${package_name}"
          echo "name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "path=dist/${package_name}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

  mingw:
    name: Windows (MinGW-w64, OpenSSL)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Configure
        shell: msys2 {0}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDEUCESSH_CRYPTO_BACKEND=OpenSSL

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Test
        shell: msys2 {0}
        run: >-
          ctest --test-dir build --parallel 1 --timeout 120
          --output-on-failure --no-tests=error

      - name: Package
        shell: msys2 {0}
        run: |
          package_name="deucegate-windows-mingw-x86_64"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}"
          cp build/deucegate.exe README.md LICENSE THIRD_PARTY.md "${package_dir}/"
          cp -R LICENSES examples "${package_dir}/"
          while IFS= read -r dll; do
            cp "${dll}" "${package_dir}/"
          done < <(ldd build/deucegate.exe | grep -oE '/ucrt64/bin/[^ ]+\.dll' | sort -u)
          (cd dist && zip -9 -r "${package_name}.zip" "${package_name}")

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deucegate-windows-mingw-x86_64
          path: dist/deucegate-windows-mingw-x86_64.zip
          if-no-files-found: error

  msvc:
    name: Windows (MSVC, OpenSSL)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect vcpkg revision
        id: vcpkg-version
        shell: pwsh
        run: >-
          "commit=$(git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD)" |
          Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-version.outputs.commit }}-openssl-x64-windows

      - name: Install OpenSSL
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg-cache,readwrite
        run: |
          vcpkg install openssl:x64-windows
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DDEUCESSH_CRYPTO_BACKEND=OpenSSL
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: >-
          ctest --test-dir build -C Release --parallel 1 --timeout 120
          --output-on-failure --no-tests=error

      - name: Package
        shell: pwsh
        run: |
          $packageName = "deucegate-windows-msvc-x86_64"
          $packageDir = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item build/Release/deucegate.exe,README.md,LICENSE,THIRD_PARTY.md $packageDir
          Copy-Item -Recurse LICENSES,examples $packageDir
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" |
            Copy-Item -Destination $packageDir
          Compress-Archive -Path $packageDir -DestinationPath "dist/${packageName}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deucegate-windows-msvc-x86_64
          path: dist/deucegate-windows-msvc-x86_64.zip
          if-no-files-found: error

  release:
    name: Attach release archives
    if: github.event_name == 'release'
    needs:
      - unix
      - mingw
      - msvc
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach archives to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" release-assets/* --clobber
